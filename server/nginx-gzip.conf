# ============================================================
# KHMER AI 2.0 - Nginx gzip 压缩配置片段
# 作用：压缩 JSON / JS / CSS 等响应体，降低小程序网络传输体积，提升「网络性能」评分
# 部署方式（在服务器 43.129.21.17 上执行）：
#   1. 把本文件放到 /etc/nginx/conf.d/gzip.conf
#   2. 或把下面 http{} 段的内容合并进 /etc/nginx/nginx.conf 的 http 块
#   3. 校验并重载：
#        sudo nginx -t
#        sudo systemctl reload nginx
# ============================================================

# ---------- 方式一：独立的 conf.d 文件（推荐） ----------
# 直接 include 到 http 块，以下配置写在 http 上下文中：

gzip on;
gzip_vary on;                 # 给代理/浏览器标明已压缩
gzip_comp_level 6;            # 压缩级别 1-9，6 为性价比最优
gzip_min_length 1024;         # 小于 1KB 不压缩（避免负优化）
gzip_proxied any;             # 对代理过来的请求也压缩
gzip_buffers 16 8k;

# 压缩类型：覆盖小程序后端常见响应（重点 application/json）
gzip_types
  application/json
  application/javascript
  application/x-javascript
  text/javascript
  text/css
  text/plain
  text/xml
  application/xml
  application/xml+rss
  image/svg+xml;

# 兜底：与上游（Node 3000）协商，若上游已带 Content-Encoding 则不再压
gzip_disable "msie6";

# ============================================================
# 可选：为静态资源（图片/字体/PDF）启用浏览器端缓存，进一步减少重复请求
# 若后端有静态目录可放开：
# location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|pdf)$ {
#     expires 7d;
#     add_header Cache-Control "public, immutable";
# }
# ============================================================
