# Nginx 反代配置示例（KHMER AI 2.0 后端）
# 适用：香港/新加坡轻量服务器，域名已解析到本机，并已申请 SSL 证书。
# 操作：
#   1. 把本文件复制到 /etc/nginx/sites-available/khmer-ai
#   2. 修改 server_name 为你的真实域名
#   3. 修改 ssl_certificate / ssl_certificate_key 为你的证书路径
#   4. ln -s /etc/nginx/sites-available/khmer-ai /etc/nginx/sites-enabled/
#   5. nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name khmer-ai.yourdomain.com;
    # 自动跳转 HTTPS（Let‘s Encrypt certbot 通常会自动加这段）
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name khmer-ai.yourdomain.com;

    # SSL 证书路径（示例， certbot 通常为 /etc/letsencrypt/live/...）
    ssl_certificate /etc/letsencrypt/live/khmer-ai.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khmer-ai.yourdomain.com/privkey.pem;

    # 安全增强（可选）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 反向代理到本机 Node 服务（默认 3000 端口）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 微信小程序常见 POST body 不会特别大，保持默认即可
        client_max_body_size 10M;
    }
}
